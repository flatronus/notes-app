<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Нотатки</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#faf8f5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Нотатки">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  /* ── System font stack — no Google Fonts needed ── */
  :root {
    --bg: #ddeeff;
    --surface: #f4f9ff;
    --ink: #1a1814;
    --ink-muted: #7a756e;
    --ink-faint: #c4bfb8;
    --accent: #c0392b;
    --accent-soft: #f9ecea;
    --border: #e2ddd7;
    --shadow: 0 2px 12px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.05);
    --radius: 14px;
    --radius-sm: 8px;
    --font: -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --tab-h: 64px;
    --top-h: 60px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    user-select: none;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
  }

  /* TOP BAR */
  .topbar {
    height: var(--top-h);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 12px;
    flex-shrink: 0;
  }

  .topbar-title {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.3px;
    flex: 1;
  }

  .search-wrap {
    position: relative;
    flex: 1;
    max-width: 320px;
  }

  .search-wrap input {
    width: 100%;
    height: 36px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    padding: 0 12px 0 34px;
    font-family: var(--font);
    font-size: 14px;
    color: var(--ink);
    outline: none;
    user-select: text;
    -webkit-user-select: text;
  }

  .search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-muted);
    pointer-events: none;
  }

  /* CONTENT */
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 6px 8px calc(var(--tab-h) + 6px);
    -webkit-overflow-scrolling: touch;
  }

  /* TABS */
  .tabbar {
    height: var(--tab-h);
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    flex-shrink: 0;
    padding: 0 4px;
  }

  .tab-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    height: 100%;
    border: none;
    background: none;
    cursor: pointer;
    color: var(--ink-muted);
    font-family: var(--font);
    font-size: 10px;
    font-weight: 500;
  }
  .tab-btn.active { color: var(--accent); }
  .tab-btn svg { width: 22px; height: 22px; }

  .tab-new { flex: 1.2; }
  .tab-new .tab-inner {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 14px rgba(192,57,43,0.4);
  }
  .tab-new svg { color: #fff; width: 24px; height: 24px; }

  /* NOTE CARD */
  .note-card {
    border-radius: var(--radius);
    margin-bottom: 4px;
    box-shadow: var(--shadow);
    word-break: break-word;
    background: #ffffff;
    cursor: pointer;
    transition: box-shadow .15s, outline .1s;
    outline: 2.5px solid transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  .note-card.selected {
    outline: 2.5px solid var(--accent);
    box-shadow: 0 2px 16px rgba(192,57,43,0.18), 0 1px 3px rgba(0,0,0,0.07);
  }

  .note-body {
    padding: 8px 12px;
  }

  .note-date {
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-muted);
    margin-bottom: 3px;
  }

  .note-text {
    font-size: 14.5px;
    line-height: 1.65;
    white-space: pre-wrap;
    user-select: text;
    -webkit-user-select: text;
    color: #1a1814;
  }

  /* deleted tab actions */
  .note-action-btn {
    border: none;
    background: rgba(0,0,0,0.06);
    border-radius: 7px;
    padding: 6px 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
    flex-shrink: 0;
  }
  .note-action-btn.danger  { color: var(--accent); background: rgba(192,57,43,0.07); }
  .note-action-btn.restore { color: #27ae60; background: rgba(39,174,96,0.07); }

  .note-del-footer {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    flex-wrap: wrap;
  }

  /* DELETE BAR — removed from topbar, now in tabbar */
  .tab-btn.tab-delete {
    color: var(--accent);
    position: relative;
  }
  .tab-btn.tab-delete .tab-del-inner {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 14px rgba(192,57,43,0.4);
  }
  .tab-btn.tab-delete svg { color: #fff; width: 22px; height: 22px; }
  .sel-count-badge {
    position: absolute;
    top: 4px;
    right: calc(50% - 28px);
    background: var(--ink);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    border-radius: 10px;
    padding: 1px 5px;
    min-width: 16px;
    text-align: center;
    line-height: 14px;
  }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    color: var(--ink-muted);
    text-align: center;
    gap: 12px;
  }
  .empty-state svg { width: 48px; height: 48px; opacity: 0.35; }
  .empty-state p { font-size: 14px; line-height: 1.5; }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(20,18,15,0.55);
    z-index: 200;
    align-items: flex-start;
    justify-content: center;
    padding-top: 16px;
  }
  .modal-overlay.open { display: flex; }

  /* На десктопі — по центру */
  @media (min-width: 768px) {
    .modal-overlay {
      align-items: center;
      padding-top: 0;
    }
    .modal {
      border-radius: var(--radius) !important;
    }
  }

  .modal {
    background: var(--surface);
    border-radius: 0 0 var(--radius) var(--radius);
    width: 100%;
    max-width: 600px;
    padding: 16px 16px 28px;
    max-height: calc(100vh - 32px);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .modal-handle {
    width: 38px;
    height: 4px;
    background: var(--ink-faint);
    border-radius: 2px;
    margin: 0 auto 16px;
  }

  .modal-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 12px;
  }

  .note-textarea {
    width: 100%;
    min-height: 130px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px;
    font-family: var(--font);
    font-size: 14.5px;
    line-height: 1.65;
    color: var(--ink);
    background: var(--bg);
    resize: vertical;
    outline: none;
    user-select: text;
    -webkit-user-select: text;
  }

  /* MODAL ACTIONS */
  .modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 18px;
  }

  .btn-save {
    flex: 1;
    height: 46px;
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    font-family: var(--font);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .btn-cancel {
    height: 46px;
    padding: 0 18px;
    background: var(--bg);
    color: var(--ink-muted);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: var(--font);
    font-size: 14px;
    cursor: pointer;
  }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: calc(var(--tab-h) + 16px);
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: #fff;
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    z-index: 500;
    transition: opacity .3s, transform .3s;
    white-space: nowrap;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @keyframes loaderPulse {
    0%, 100% { transform: scale(0.6); opacity: 0.4; }
    50%       { transform: scale(1);   opacity: 1; }
  }
  .loader-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    animation: loaderPulse 1s ease-in-out infinite;
  }


</style>
</head>
<body>

<!-- LOADING SCREEN -->
<div id="loadingScreen" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:16px;background:var(--bg);">
  <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#c0392b" stroke-width="1.5">
    <rect x="3" y="3" width="18" height="18" rx="3"/>
    <line x1="7" y1="8" x2="17" y2="8"/>
    <line x1="7" y1="12" x2="17" y2="12"/>
    <line x1="7" y1="16" x2="13" y2="16"/>
  </svg>
  <div style="display:flex;gap:6px;align-items:center;">
    <div class="loader-dot"></div>
    <div class="loader-dot" style="animation-delay:.2s"></div>
    <div class="loader-dot" style="animation-delay:.4s"></div>
  </div>
</div>

<!-- AUTH SCREEN -->
<div id="authScreen" style="display:none;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:24px;background:var(--bg);padding:32px;text-align:center;">
  <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#c0392b" stroke-width="1.5">
    <rect x="3" y="3" width="18" height="18" rx="3"/>
    <line x1="7" y1="8" x2="17" y2="8"/>
    <line x1="7" y1="12" x2="17" y2="12"/>
    <line x1="7" y1="16" x2="13" y2="16"/>
  </svg>
  <div>
    <div style="font-size:22px;font-weight:700;margin-bottom:6px;">Нотатки</div>
    <div id="startMsg" style="font-size:14px;color:var(--ink-muted);">Нотатки зберігаються у файлі .json на вашому пристрої</div>
  </div>
  <button data-action="resume" id="btnResume" style="display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 24px;background:#fff;border:1.5px solid var(--border);border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;font-family:var(--font);box-shadow:0 2px 8px rgba(0,0,0,0.08);min-width:260px;display:none;">Продовжити: <span id="resumeName"></span></button>
  <button data-action="createfile" style="display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 24px;background:#fff;border:1.5px solid var(--border);border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;font-family:var(--font);box-shadow:0 2px 8px rgba(0,0,0,0.08);min-width:260px;">Створити новий файл</button>
  <button data-action="openfile" style="display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 24px;background:#fff;border:1.5px solid var(--border);border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;font-family:var(--font);box-shadow:0 2px 8px rgba(0,0,0,0.08);min-width:260px;">Відкрити існуючий файл</button>
  <div id="appVer" style="font-size:11px;color:var(--ink-faint);"></div>
</div>

<!-- APP SCREEN -->
<div id="appScreen" style="display:none;flex-direction:column;height:100vh;">

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-title" id="topbarTitle">Нотатки</div>
  <span id="fileInfo" style="font-size:11px;color:var(--ink-muted);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>
  <button data-action="changefile" id="btnChange" style="border:none;background:none;cursor:pointer;color:var(--ink-muted);font-size:11px;font-family:var(--font);padding:4px 6px;border-radius:6px;border:1px solid var(--border);">Файл</button>
  <button data-action="export" id="btnExport" style="border:none;background:none;cursor:pointer;color:var(--ink-muted);font-size:11px;font-family:var(--font);padding:4px 6px;border-radius:6px;border:1px solid var(--border);display:none;">Експорт</button>
  <div class="search-wrap">
    <span class="search-icon">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15">
        <circle cx="8.5" cy="8.5" r="5.5"/><path d="M13.5 13.5L17 17"/>
      </svg>
    </span>
    <input type="text" id="searchInput" placeholder="Пошук…">
  </div>
</div>

<!-- CONTENT -->
<div class="content" id="mainContent"></div>

<!-- TAB BAR -->
<nav class="tabbar">
  <button class="tab-btn tab-new" data-action="new">
    <div class="tab-inner">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </div>
  </button>

  <button class="tab-btn active" id="tabNotes" data-action="tab" data-tab="notes">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="3" width="18" height="18" rx="3"/>
      <line x1="7" y1="8" x2="17" y2="8"/>
      <line x1="7" y1="12" x2="17" y2="12"/>
      <line x1="7" y1="16" x2="13" y2="16"/>
    </svg>
    Нотатки
  </button>

  <!-- Delete selected -->
  <button class="tab-btn tab-delete" id="tabDeleteSel" title="Видалити вибране">
    <div class="tab-del-inner">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="22" height="22">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </div>
    <span id="selCountBadge" class="sel-count-badge" style="display:none;"></span>
  </button>

  <button class="tab-btn" id="tabDeleted" data-action="tab" data-tab="deleted">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="3 6 5 6 21 6"/>
      <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
      <path d="M10 11v6"/><path d="M14 11v6"/>
      <path d="M9 6V4h6v2"/>
    </svg>
    Видалені
  </button>
</nav>

<!-- CREATE/EDIT MODAL -->
<div class="modal-overlay" id="noteModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalTitle">Нова нотатка</div>

    <textarea class="note-textarea" id="noteText" placeholder="Введіть текст нотатки…"></textarea>

    <div class="modal-actions">
      <button class="btn-cancel" data-action="close">Скасувати</button>
      <button class="btn-save" data-action="save">Зберегти</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script type="module">
const APP_VERSION = '2.1.0';

// ── LOCAL FILE STORAGE STATE ──
const FS_SUPPORTED = 'showSaveFilePicker' in window && 'showOpenFilePicker' in window;
const FILE_TYPES   = [{ description: 'JSON', accept: { 'application/json': ['.json'] } }];
let fileHandle   = null;   // FileSystemFileHandle (.json на диску)
let lastModified = 0;      // час зміни файла, який ми знаємо
let saveTimer    = null;
let saving       = false;
let dirty        = false;

// ── IndexedDB: лише для запам'ятовування вибраного файла (і запасне сховище) ──
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('notes-app', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror   = () => rej(r.error);
  });
}
async function idbGet(k) {
  const db = await idb();
  return new Promise((res, rej) => {
    const q = db.transaction('kv').objectStore('kv').get(k);
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
  });
}
async function idbSet(k, v) {
  const db = await idb();
  return new Promise((res, rej) => {
    const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k);
    t.oncomplete = () => res(); t.onerror = () => rej(t.error);
  });
}

// ── APP STATE ──
let notes        = [];
let deletedNotes = [];
let currentTab   = 'notes';
let editingId    = null;

// ── HELPERS ──
function uid()    { return Date.now().toString(36)+Math.random().toString(36).slice(2); }
function isLight(hex) {
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return (r*299+g*587+b*114)/1000>160;
}
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDT(iso) {
  if(!iso) return '';
  const d = new Date(iso);
  const weekday = d.toLocaleString('uk-UA', {weekday:'short'});
  const dt      = d.toLocaleString('uk-UA', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  return weekday + ', ' + dt;
}
function fmtDateOnly(iso) {
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('uk-UA', {day:'2-digit',month:'2-digit',year:'numeric'});
}
function dateKey(iso) {
  if(!iso) return '';
  const d = new Date(iso);
  return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
}
function toast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2500);
}

// ── STORAGE OPS ──
// Назви збережено, щоб не змінювати функції збереження/видалення нотаток.
// Кожна дія лише планує автозбереження всього файла.
const fbSaveNote    = () => persist();
const fbDeleteNote  = () => persist();
const fbSaveDeleted = () => persist();
const fbDelDeleted  = () => persist();

const serialize = () => JSON.stringify({ app: 'notes', version: APP_VERSION, notes, deleted: deletedNotes }, null, 2);

function applyData(txt) {
  const d = txt && txt.trim() ? JSON.parse(txt) : {};
  notes        = Array.isArray(d.notes)   ? d.notes   : [];
  deletedNotes = Array.isArray(d.deleted) ? d.deleted : [];
}

function setStatus(s) {
  const el = document.getElementById('fileInfo'); if(!el) return;
  const ic = { saving: '⟳', saved: '✓', error: '⚠', nofile: '↻' }[s] || '';
  el.dataset.s = s;
  el.textContent = ic + ' ' + (fileHandle ? fileHandle.name : 'у браузері');
  el.style.cursor = s === 'nofile' ? 'pointer' : '';
  el.title = s === 'nofile' ? 'Файл не підключено — натисніть, щоб надати доступ' : '';
}

function persist() {
  dirty = true; setStatus('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 400);
}

async function flushSave() {
  clearTimeout(saveTimer);
  if(saving || !dirty) return;
  saving = true; dirty = false;
  try {
    const data = serialize();
    await idbSet('data', data);                       // локальна копія — завжди
    if(fileHandle) {
      await idbSet('pending', true);                  // у файл ще не потрапило
      if(await ensurePermission(fileHandle, false)) {
        const w = await fileHandle.createWritable();
        await w.write(data); await w.close();
        lastModified = (await fileHandle.getFile()).lastModified;
        await idbSet('pending', false);
        setStatus(dirty ? 'saving' : 'saved');
      } else setStatus('nofile');                     // запишемо, щойно буде доступ
    } else setStatus(dirty ? 'saving' : 'saved');
  } catch(e) {
    dirty = true; setStatus('error');
    toast('Помилка збереження: ' + (e.name || e.message));
    saving = false; return;
  }
  saving = false;
  if(dirty) flushSave();
}

// ── SELECTION ──
let selectedIds = new Set();

function updateDeleteBar() {
  const badge = document.getElementById('selCountBadge');
  if(selectedIds.size > 0) {
    badge.style.display = 'block';
    badge.textContent = selectedIds.size;
  } else {
    badge.style.display = 'none';
  }
}

function toggleSelect(id) {
  if(selectedIds.has(id)) {
    selectedIds.clear();
  } else {
    selectedIds.clear();
    selectedIds.add(id);
  }
  document.querySelectorAll('.note-card').forEach(el => {
    el.classList.toggle('selected', selectedIds.has(el.dataset.id));
  });
  updateDeleteBar();
}

function clearSelection() {
  selectedIds.clear();
  document.querySelectorAll('.note-card.selected').forEach(el => el.classList.remove('selected'));
  updateDeleteBar();
}

function deleteSelected() {
  if(!selectedIds.size) return;
  selectedIds.forEach(id => {
    const i = notes.findIndex(n => n.id === id);
    if(i === -1) return;
    const del = {...notes[i], deletedAt: new Date().toISOString()};
    deletedNotes.push(del); fbSaveDeleted(del); fbDeleteNote(notes[i].id);
    notes.splice(i, 1);
  });
  clearSelection();
  renderNotes();
  toast('Переміщено до видалених');
}

// ── RENDER ──
function renderNotes() {
  const content = document.getElementById('mainContent');
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  let list = currentTab==='deleted' ? deletedNotes : notes;
  if(q) list=list.filter(n=>n.text.toLowerCase().includes(q));
  if(!list.length){
    const msgs={notes:'Натисніть + щоб створити нотатку',deleted:'Видалені нотатки порожні'};
    content.innerHTML=`<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48">
        <rect x="3" y="3" width="18" height="18" rx="3"/>
        <line x1="7" y1="8" x2="17" y2="8"/>
        <line x1="7" y1="12" x2="17" y2="12"/>
      </svg>
      <p>${q?'Нічого не знайдено':msgs[currentTab]||'Порожньо'}</p></div>`;
    return;
  }
  const isDel = currentTab === 'deleted';
  const items = list.map(n => {
    const isSel = selectedIds.has(n.id);
    if(isDel) {
      return `<div class="note-card${isSel?' selected':''}" data-id="${n.id}">
        <div class="note-body">
          <div class="note-date">${fmtDateOnly(n.created)}</div>
          <div class="note-text">${esc(n.text)}</div>
          <div class="note-del-footer">
            <button class="note-action-btn restore" data-action="restore" data-id="${n.id}" title="Відновити"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-5.28"/></svg> Відновити</button>
            <button class="note-action-btn danger" data-action="permdelete" data-id="${n.id}" title="Видалити назавжди"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>
          </div>
        </div></div>`;
    }
    return `<div class="note-card${isSel?' selected':''}" data-id="${n.id}">
      <div class="note-body">
        <div class="note-date">${fmtDateOnly(n.created)}</div>
        <div class="note-text">${esc(n.text)}</div>
      </div></div>`;
  });
  content.innerHTML = items.join('');

  // Attach single/double click for note cards (active notes)
  content.querySelectorAll('.note-card').forEach(card => {
    const id = card.dataset.id;
    let clickTimer = null;

    card.addEventListener('click', e => {
      if(e.target.closest('[data-action]')) return; // let buttons handle themselves
      clearTimeout(clickTimer);
      clickTimer = setTimeout(() => {
        // single click = select/deselect
        if(currentTab !== 'deleted') toggleSelect(id);
      }, 220);
    });

    card.addEventListener('dblclick', e => {
      if(e.target.closest('[data-action]')) return;
      clearTimeout(clickTimer);
      if(currentTab !== 'deleted') openEdit(id);
    });

    // Mobile double-tap
    let lastTap = 0;
    card.addEventListener('touchend', e => {
      if(e.target.closest('[data-action]')) return;
      const now = Date.now();
      if(now - lastTap < 350) {
        e.preventDefault();
        clearTimeout(clickTimer);
        if(currentTab !== 'deleted') openEdit(id);
      }
      lastTap = now;
    });
  });
}

// ── TABS ──
function switchTab(tab) {
  currentTab=tab;
  clearSelection();
  ['Notes','Deleted'].forEach(t=>document.getElementById('tab'+t)?.classList.remove('active'));
  document.getElementById('tab'+tab.charAt(0).toUpperCase()+tab.slice(1))?.classList.add('active');
  document.getElementById('topbarTitle').textContent={notes:'Нотатки',deleted:'Видалені'}[tab]||tab;
  renderNotes();
}

// ── MODAL ──
function openCreateModal() {
  editingId=null;
  document.getElementById('modalTitle').textContent='Нова нотатка';
  document.getElementById('noteText').value='';
  document.getElementById('noteModal').classList.add('open');
  setTimeout(()=>document.getElementById('noteText').focus(),200);
}
function openEdit(id) {
  const n=notes.find(n=>n.id===id); if(!n) return;
  editingId=id;
  document.getElementById('modalTitle').textContent='Редагувати нотатку';
  document.getElementById('noteText').value=n.text;
  document.getElementById('noteModal').classList.add('open');
  setTimeout(()=>document.getElementById('noteText').focus(),200);
}
function closeModal() {
  document.getElementById('noteModal').classList.remove('open');
}

function saveNote() {
  const text=document.getElementById('noteText').value.trim();
  if(!text){toast('Введіть текст нотатки');return;}
  if(editingId){
    const i=notes.findIndex(n=>n.id===editingId);
    if(i!==-1){notes[i]={...notes[i],text};fbSaveNote(notes[i]);}
  } else {
    const note={id:uid(),text,created:new Date().toISOString()};
    notes.push(note); fbSaveNote(note);
  }
  closeModal(); renderNotes();
}

// ── NOTE ACTIONS ──
function completeNote(id) {
  const i=notes.findIndex(n=>n.id===id); if(i===-1)return;
  const del={...notes[i],deletedAt:new Date().toISOString()};
  deletedNotes.push(del); fbSaveDeleted(del); fbDeleteNote(notes[i].id);
  notes.splice(i,1); renderNotes(); toast('Переміщено до видалених');
}
function restoreNote(id) {
  const i=deletedNotes.findIndex(n=>n.id===id); if(i===-1)return;
  const n={...deletedNotes[i]}; delete n.deletedAt;
  notes.unshift(n); fbSaveNote(n); fbDelDeleted(deletedNotes[i].id);
  deletedNotes.splice(i,1); renderNotes(); toast('Нотатку відновлено');
}
function permDelete(id) {
  fbDelDeleted(id); deletedNotes=deletedNotes.filter(n=>n.id!==id);
  renderNotes(); toast('Видалено назавжди');
}

// ── FILE ACCESS ──
async function ensurePermission(h, ask) {
  const o = { mode: 'readwrite' };
  if(await h.queryPermission(o) === 'granted') return true;
  return ask && await h.requestPermission(o) === 'granted';
}
async function loadFromHandle() {
  const f = await fileHandle.getFile();
  lastModified = f.lastModified;
  applyData(await f.text());
}
async function initStorage() {
  try {
    const copy = await idbGet('data');
    if(copy) applyData(copy);
    if(!FS_SUPPORTED) { enterApp(); return; }
    const h = await idbGet('handle');
    if(!h) { showStart(); return; }               // найперший запуск: файл обирається один раз
    fileHandle = h;
    if(copy) { enterApp(); syncFile(false); return; }   // одразу в додаток, файл — у фоні
    if(await ensurePermission(h, false)) { await loadFromHandle(); await idbSet('data', serialize()); enterApp(); return; }
    showStart();
  } catch(e) {
    showStart('Не вдалося відкрити файл: ' + (e.name || e.message));
  }
}
// Узгоджує локальну копію з файлом. ask=true — можна показати запит дозволу (лише з кліку)
async function syncFile(ask) {
  if(!fileHandle) return false;
  try {
    if(!(await ensurePermission(fileHandle, ask))) { setStatus('nofile'); return false; }
    if(await idbGet('pending')) { dirty = true; await flushSave(); }      // локальні зміни → у файл
    else { await loadFromHandle(); await idbSet('data', serialize()); renderNotes(); setStatus('saved'); }
    return true;
  } catch(e) { setStatus('error'); toast('Файл недоступний: ' + (e.name || e.message)); return false; }
}
async function createFile() {
  try {
    const h = await showSaveFilePicker({ suggestedName: 'notes.json', types: FILE_TYPES });
    fileHandle = h; notes = []; deletedNotes = [];
    await idbSet('handle', h);
    dirty = true; await flushSave();
    enterApp();
  } catch(e) { if(e.name !== 'AbortError') toast('Помилка: ' + (e.name || e.message)); }
}
async function openFile() {
  try {
    const [h] = await showOpenFilePicker({ types: FILE_TYPES });
    if(!(await ensurePermission(h, true))) { toast('Потрібен дозвіл на запис у файл'); return; }
    fileHandle = h; await loadFromHandle();
    await idbSet('handle', h); await idbSet('pending', false); await idbSet('data', serialize());
    enterApp();
  } catch(e) { if(e.name !== 'AbortError') toast('Помилка: ' + (e.name || e.message)); }
}
async function resumeFile() {
  if(await syncFile(true)) enterApp();
  else showStart('Потрібен дозвіл на доступ до файла');
}
async function changeFile() {
  await flushSave();
  showStart();
}
function exportJson() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([serialize()], { type: 'application/json' }));
  a.download = 'notes.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
// Якщо файл змінили ззовні (інший редактор, синхронізація папки) — підхоплюємо зміни
async function checkExternalChange() {
  if(!fileHandle || dirty || saving) return;
  if(document.getElementById('noteModal').classList.contains('open')) return;
  try {
    const f = await fileHandle.getFile();
    if(f.lastModified !== lastModified) {
      lastModified = f.lastModified;
      applyData(await f.text()); renderNotes();
      toast('Файл оновлено ззовні');
    }
  } catch(e) {}
}

// ── AUTH ──
function hideLoading() {
  const el = document.getElementById('loadingScreen');
  if(el) el.style.display = 'none';
}

function enterApp() {
  hideLoading();
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('appScreen').style.display  = 'flex';
  document.getElementById('btnChange').style.display = FS_SUPPORTED ? '' : 'none';
  document.getElementById('btnExport').style.display = FS_SUPPORTED ? 'none' : '';
  setStatus('saved');
  renderNotes();
}

function showStart(msg) {
  hideLoading();
  document.getElementById('startMsg').textContent = msg || 'Нотатки зберігаються у файлі .json на вашому пристрої';
  document.getElementById('appVer').textContent = 'Версія ' + APP_VERSION;
  const r = document.getElementById('btnResume');
  r.style.display = fileHandle ? 'flex' : 'none';
  if(fileHandle) document.getElementById('resumeName').textContent = fileHandle.name;
  document.getElementById('authScreen').style.display = 'flex';
  document.getElementById('appScreen').style.display  = 'none';
}

// ── INIT ──
initStorage();
let reconnectTried = false;
document.addEventListener('click', e => {
  const el = document.getElementById('fileInfo');
  if(!fileHandle || !el || el.dataset.s !== 'nofile') return;
  if(reconnectTried && !e.target.closest('#fileInfo')) return;
  reconnectTried = true; syncFile(true);
}, true);
window.addEventListener('focus', checkExternalChange);
window.addEventListener('pagehide', () => { if(dirty) flushSave(); });
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'hidden') { if(dirty) flushSave(); }
  else checkExternalChange();
});

// ── EVENT DELEGATION (replaces all inline onclick) ──
document.addEventListener('click', e=>{
  const t=e.target.closest('[data-action]');
  if(t){
    e.stopPropagation();
    const {action,id,tab,color}=t.dataset;
    if(action==='edit')       openEdit(id);
    if(action==='complete')   completeNote(id);
    if(action==='restore')    restoreNote(id);
    if(action==='permdelete') permDelete(id);
    if(action==='tab')        { clearSelection(); switchTab(tab); }
    if(action==='new')        openCreateModal();
    if(action==='save')       saveNote();
    if(action==='close')      closeModal();
    if(action==='createfile') createFile();
    if(action==='openfile')   openFile();
    if(action==='resume')     resumeFile();
    if(action==='changefile') changeFile();
    if(action==='export')     exportJson();
    return;
  }
  // Click outside notes = clear selection
  if(!e.target.closest('.note-card')) clearSelection();
  if(e.target===document.getElementById('noteModal')) closeModal();
});

// Delete selected button (X in tabbar)
document.getElementById('tabDeleteSel').addEventListener('click', deleteSelected);

document.getElementById('searchInput').addEventListener('input',renderNotes);

// ── PWA SERVICE WORKER ──
if('serviceWorker'in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>

</div><!-- /appScreen -->
